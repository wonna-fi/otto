name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # GitHub's Ubuntu images come with Chrome, but don't allow its sandbox.
      - run: node --test --test-reporter=spec --test-concurrency=1 'otto/tests/*.test.ts' 'otto/scripts/lib/*.test.ts'
        env:
          OTTO_TEST_CHROME_FLAGS: --no-sandbox
